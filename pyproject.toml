[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gc-depth"
dynamic = ["version"]
description = "Compute and visualize GC content versus sequencing depth per genomic window."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Dede Kurniawan", email = "dedekurniawan@genomics.cn" },
]
maintainers = [
  { name = "Dede Kurniawan", email = "dedekurniawan@genomics.cn" },
]
keywords = [
  "bioinformatics",
  "genomics",
  "genome assembly",
  "contamination",
  "GC content",
  "sequencing depth",
  "pandepth",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "matplotlib>=3.6",
  "numpy>=1.23",
  "scipy>=1.9",
]

[project.urls]
Homepage = "https://github.com/dedee95/GC-depth"
Repository = "https://github.com/dedee95/GC-depth"
Issues = "https://github.com/dedee95/GC-depth/issues"

[project.scripts]
gc_depth = "gc_depth.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gc_depth.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

